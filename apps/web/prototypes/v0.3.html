<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aquarius Prototype v0.3 - Multiplayer On-Chain DAO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <style>body { margin:0; background:#0a0a1f; color:#0ff; font-family:monospace; }</style>
</head>
<body>
    <div style="position:absolute;top:10px;left:10px;">
        <h1>♒ AQUARIUS v0.3</h1>
        <p>One Community • Hybrid Human + ERC-8004 AI Members • On-Chain State</p>
        <button onclick="createProposal()" style="padding:10px 20px;background:#0ff;color:#000;border:none;cursor:pointer;">
            Create On-Chain Proposal
        </button>
        <button onclick="addAIMember()" style="padding:10px 20px;margin-left:10px;background:#f0f;color:#000;border:none;cursor:pointer;">
            Register ERC-8004 AI Member
        </button>
    </div>
    <script>
        let scene, camera, renderer;
        let nodes = [];
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            camera.position.z = 30;
            // Add glowing nodes (Human + AI)
            for(let i=0; i<6; i++) {
                const geometry = new THREE.SphereGeometry(1, 32, 32);
                const material = new THREE.MeshBasicMaterial({color: i<3 ? 0x00ffff : 0xff00ff});
                const node = new THREE.Mesh(geometry, material);
                node.position.x = (i-2.5)*5;
                scene.add(node);
                nodes.push(node);
            }
            animate();
        }
        function animate() {
            requestAnimationFrame(animate);
            nodes.forEach((n,i) => n.rotation.y += 0.01 + i*0.005);
            renderer.render(scene, camera);
        }
        window.createProposal = () => alert("On-chain Proposal Created! (Event emitted - shared state updated across emulators)");
        window.addAIMember = () => alert("ERC-8004 AI Member Registered - Community now has hybrid membership");
        init();
    </script>
</body>
</html>
