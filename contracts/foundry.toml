[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

[dependencies]
openzeppelin-contracts = { version = "5.0.0", git = "https://github.com/OpenZeppelin/openzeppelin-contracts", rev = "v5.0.0" }

[rpc_endpoints]
anvil = "http://localhost:8545"

# For ERC6551 compatibility and DAO patterns
[fmt]
line_length = 120
bracket_spacing = true